name: Build Mod JAR

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Gradle 2.14
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14-bin.zip
          unzip -q gradle-2.14-bin.zip -d /tmp
          echo "/tmp/gradle-2.14/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 2.14

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hudmod-build
          path: build/libs/hudmod-*.jar
